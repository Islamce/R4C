[project]
name = "r4c-bim-worker"
version = "0.1.0"
description = "Asynchronous IFC validation and extraction service for R4C"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "ifcopenshell>=0.8,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "trimesh>=4.7,<6",
  "pydantic-settings>=2.10,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
