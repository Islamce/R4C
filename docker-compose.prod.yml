name: r4c

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set r4c http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "r4c/$$S3_BUCKET"
        mc anonymous set none "r4c/$$S3_BUCKET"
        mc stat "r4c/$$S3_BUCKET"
    networks:
      - backend

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    restart: "no"
    command: ["prisma:migrate:deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      BIM_WORKER_URL: http://bim-worker:8000
      BIM_WORKER_TOKEN: ${BIM_WORKER_TOKEN}
      BIM_MAX_ELEMENTS: ${BIM_MAX_ELEMENTS}
      BIM_MAX_FILE_BYTES: ${BIM_MAX_FILE_BYTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE}
      RATE_LIMIT_AUTH_SESSION_PER_MINUTE: ${RATE_LIMIT_AUTH_SESSION_PER_MINUTE}
      RATE_LIMIT_TENANT_LOOKUP_PER_MINUTE: ${RATE_LIMIT_TENANT_LOOKUP_PER_MINUTE}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE}
      RATE_LIMIT_SEARCH_EXPORT_PER_MINUTE: ${RATE_LIMIT_SEARCH_EXPORT_PER_MINUTE}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully
      bim-worker:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN}
      TENANT_DEFAULT_CODE: ${TENANT_DEFAULT_CODE}
      SEED_UAT_TENANT_CODE: ${SEED_UAT_TENANT_CODE}
      SEED_UAT_TENANT_NAME_AR: ${SEED_UAT_TENANT_NAME_AR}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  bim-worker:
    build:
      context: ./apps/bim-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      BIM_WORKER_TOKEN: ${BIM_WORKER_TOKEN}
      BIM_ALLOWED_SOURCE_HOSTS: ${BIM_ALLOWED_SOURCE_HOSTS}
      BIM_MAX_ELEMENTS: ${BIM_MAX_ELEMENTS}
      BIM_MAX_FILE_BYTES: ${BIM_MAX_FILE_BYTES}
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SEED_TENANT_CODE: ${SEED_TENANT_CODE}
      SEED_TENANT_NAME: ${SEED_TENANT_NAME}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_UAT_TENANT_CODE: ${SEED_UAT_TENANT_CODE}
      SEED_UAT_TENANT_NAME: ${SEED_UAT_TENANT_NAME}
      SEED_UAT_ADMIN_EMAIL: ${SEED_UAT_ADMIN_EMAIL}
      SEED_UAT_ADMIN_PASSWORD: ${SEED_UAT_ADMIN_PASSWORD}
      SEED_UAT_SUBMIT_EMAIL: ${SEED_UAT_SUBMIT_EMAIL}
      SEED_UAT_SUBMIT_DISPLAY_NAME: ${SEED_UAT_SUBMIT_DISPLAY_NAME}
      SEED_UAT_SUBMIT_PASSWORD: ${SEED_UAT_SUBMIT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
      args:
        CADDY_VERSION: 2.11.4
        CLOUDFLARE_PLUGIN_VERSION: v0.2.3
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
