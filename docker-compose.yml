services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: r4c
      POSTGRES_PASSWORD: r4c_dev
      POSTGRES_DB: r4c
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r4c -d r4c"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: r4c
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-r4c}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set r4c http://minio:9000 r4c change-me-now
        mc mb --ignore-existing "r4c/$$S3_BUCKET"
        mc anonymous set none "r4c/$$S3_BUCKET"
        mc stat "r4c/$$S3_BUCKET"

  bim-worker:
    build:
      context: ./apps/bim-worker
      dockerfile: Dockerfile
    environment:
      BIM_WORKER_TOKEN: ${BIM_WORKER_TOKEN}
      BIM_ALLOWED_SOURCE_HOSTS: ${BIM_ALLOWED_SOURCE_HOSTS:-host.docker.internal}
      BIM_MAX_ELEMENTS: ${BIM_MAX_ELEMENTS:-250000}
      BIM_MAX_FILE_BYTES: ${BIM_MAX_FILE_BYTES:-1073741824}
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
