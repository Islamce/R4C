name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/bim-worker/pyproject.toml

      - name: Audit resolved Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          pip-audit --strict apps/bim-worker

      - name: Generate repository SBOM
        run: |
          docker run --rm             -v "$PWD:/workspace"             aquasec/trivy:0.72.0 fs             --format cyclonedx             --output /workspace/r4c-sbom.cdx.json             /workspace

      - name: Scan repository dependencies, secrets, and configuration
        run: |
          docker run --rm             -v "$PWD:/workspace"             -v "$HOME/.cache/trivy:/root/.cache/"             aquasec/trivy:0.72.0 fs             --scanners vuln,secret,misconfig             --severity HIGH,CRITICAL             --ignore-unfixed             --exit-code 1             /workspace

      - name: Build BIM worker image
        run: docker build --tag r4c-bim-worker:ci apps/bim-worker

      - name: Scan BIM worker image
        run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$HOME/.cache/trivy:/root/.cache/"             aquasec/trivy:0.72.0 image             --scanners vuln,secret,misconfig             --severity HIGH,CRITICAL             --ignore-unfixed             --exit-code 1             r4c-bim-worker:ci

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4c-cyclonedx-sbom
          path: r4c-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
