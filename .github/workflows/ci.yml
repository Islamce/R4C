name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: r4c
          POSTGRES_PASSWORD: r4c_dev
          POSTGRES_DB: r4c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r4c -d r4c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://r4c:r4c_dev@localhost:5432/r4c
      DIRECT_URL: postgresql://r4c:r4c_dev@localhost:5432/r4c
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: r4c-ci
      S3_ACCESS_KEY: r4c-ci-${{ github.run_id }}
      S3_SECRET_KEY: r4c-ci-value-${{ github.run_id }}
      JWT_ACCESS_SECRET: ci-only-${{ github.run_id }}-value-at-least-32-characters-long
      # BIM remains covered by CI only when explicitly opted in. Deployment defaults false.
      BIM_ENABLED: true
      BIM_WORKER_URL: http://127.0.0.1:65535
      BIM_WORKER_TOKEN: ci-bim-worker-${{ github.run_id }}
      API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      CORS_ORIGINS: http://127.0.0.1:3000
      TENANT_DEFAULT_CODE: PH4
    steps:
      - uses: actions/checkout@v7

      - name: Reject committed secrets
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'; then
            echo "Potential secret file committed"
            exit 1
          fi

      - name: Start S3-compatible object storage
        run: |
          docker run --rm -d --name r4c-minio             -p 9000:9000             -e MINIO_ROOT_USER="$S3_ACCESS_KEY"             -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY"             minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs r4c-minio
          exit 1

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate Prisma client
        run: |
          pnpm --filter @r4c/api prisma:validate
          pnpm --filter @r4c/api prisma:generate

      - name: Rehearse database migration deployment
        run: |
          pnpm --filter @r4c/api prisma:migrate:deploy
          pnpm --filter @r4c/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run API security contracts
        run: pnpm --filter @r4c/api test

      - name: Run authenticated runtime integration
        run: pnpm --filter @r4c/api test:e2e

      - name: Verify BIM-disabled commercial runtime boundary
        run: pnpm --filter @r4c/api test:bim-disabled

      - name: Verify rate limiting and proxy client isolation
        run: |
          pnpm --filter @r4c/api test:rate-limit > rate-limit-verification.txt 2>&1
          cat rate-limit-verification.txt

      - name: Retain rate-limit verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: rate-limit-verification-evidence
          path: rate-limit-verification.txt
          retention-days: 30

      - name: Seed frontend journey tenant
        env:
          SEED_TENANT_CODE: PH4
          SEED_TENANT_NAME: Phase 4 Frontend Tenant
          SEED_ADMIN_EMAIL: phase4.admin@r4c.test
          SEED_ADMIN_PASSWORD: Phase4-${{ github.run_id }}-Correct-Horse-Battery-Staple
        run: |
          pnpm --filter @r4c/api seed
          pnpm --filter @r4c/api exec node - <<'NODE' >> "$GITHUB_ENV"
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.tenant.findUnique({ where: { code: 'PH4' } })
            .then((tenant) => {
              if (!tenant) throw new Error('Phase 4 tenant not found');
              console.log(`JOURNEY_TENANT_ID=${tenant.id}`);
            })
            .finally(() => prisma.$disconnect());
          NODE

      - name: Start API and Next.js production servers
        env:
          API_PORT: 4000
          HOLD_EXPIRY_SWEEP_INTERVAL_MS: 300000
          RATE_LIMIT_GLOBAL_PER_MINUTE: 1000
          RATE_LIMIT_LOGIN_PER_MINUTE: 100
          RATE_LIMIT_AUTH_SESSION_PER_MINUTE: 100
        run: |
          node apps/api/dist/main.js > phase4-api-runtime.log 2>&1 &
          echo $! > phase4-api-runtime.pid
          pnpm --filter @r4c/web exec next start -p 3000 > phase4-web-runtime.log 2>&1 &
          echo $! > phase4-web-runtime.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat phase4-api-runtime.log
          cat phase4-web-runtime.log
          exit 1

      - name: Verify live bilingual frontend journey
        env:
          JOURNEY_ADMIN_EMAIL: phase4.admin@r4c.test
          JOURNEY_ADMIN_PASSWORD: Phase4-${{ github.run_id }}-Correct-Horse-Battery-Staple
          JOURNEY_WEB_URL: http://127.0.0.1:3000
          JOURNEY_API_URL: http://127.0.0.1:4000/api/v1
        run: |
          pnpm --filter @r4c/web test:journey > frontend-journey-verification.txt 2>&1
          cat frontend-journey-verification.txt

      - name: Retain frontend journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-journey-verification-evidence
          path: |
            frontend-journey-verification.txt
            phase4-api-runtime.log
            phase4-web-runtime.log
          retention-days: 30

      - name: Stop frontend journey servers
        if: always()
        run: |
          test -f phase4-web-runtime.pid && kill $(cat phase4-web-runtime.pid) || true
          test -f phase4-api-runtime.pid && kill $(cat phase4-api-runtime.pid) || true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/bim-worker/pyproject.toml

      - name: Install and validate BIM worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./apps/bim-worker[dev]"
          ruff check apps/bim-worker
          pytest -q apps/bim-worker/tests
