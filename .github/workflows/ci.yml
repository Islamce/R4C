name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'; then
            echo "Potential secret file committed"
            exit 1
          fi
      - name: Validate required foundation files
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/mvp-scope.md
          test -f docs/security.md
          test -f docker-compose.yml
