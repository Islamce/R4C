name: Phase 7 startup diagnostics

on:
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/prisma/seed-uat.ts"
      - "docker-compose.prod.yml"
      - ".env.production.example"
      - "scripts/generate-production-env.sh"
      - ".github/workflows/phase7-startup-diagnostics.yml"

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate local production configuration
        run: |
          chmod +x scripts/generate-production-env.sh
          ./scripts/generate-production-env.sh .env.production.example .env.production
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.env.production')
          text = path.read_text()
          replacements = {
              'APP_DOMAIN=r4c.example.com': 'APP_DOMAIN=r4c.local',
              'API_DOMAIN=api.r4c.example.com': 'API_DOMAIN=api.r4c.local',
              'TENANT_BASE_DOMAIN=r4c.example.com': 'TENANT_BASE_DOMAIN=r4c.local',
              'ACME_EMAIL=owner@example.com': 'ACME_EMAIL=ci@r4c.local',
              'CLOUDFLARE_API_TOKEN=REPLACE_WITH_CLOUDFLARE_DNS_TOKEN': 'CLOUDFLARE_API_TOKEN=ci-local-tls',
              'CADDYFILE=Caddyfile': 'CADDYFILE=Caddyfile.local',
              'NEXT_PUBLIC_API_URL=https://api.r4c.example.com/api/v1': 'NEXT_PUBLIC_API_URL=https://api.r4c.local/api/v1',
              'CORS_ORIGINS=https://r4c.example.com,https://alomran.r4c.example.com': 'CORS_ORIGINS=https://r4c.local,https://alomran.r4c.local',
              'SEED_ADMIN_EMAIL=platform.admin@example.com': 'SEED_ADMIN_EMAIL=platform.admin@r4c.local',
              'SEED_UAT_ADMIN_EMAIL=uat.admin@alomran.example.com': 'SEED_UAT_ADMIN_EMAIL=uat.admin@alomran.local',
              'SEED_UAT_SUBMIT_EMAIL=uat.submit@alomran.example.com': 'SEED_UAT_SUBMIT_EMAIL=uat.submit@alomran.local',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Diagnose infrastructure and one-shot services
        run: |
          set +e
          : > phase7-startup.log
          docker compose --env-file .env.production -f docker-compose.prod.yml pull postgres redis minio minio-init >> phase7-startup.log 2>&1
          echo "pull_status=$?" >> phase7-startup.log
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis minio >> phase7-startup.log 2>&1
          echo "infra_status=$?" >> phase7-startup.log
          sleep 15
          docker compose --env-file .env.production -f docker-compose.prod.yml ps -a >> phase7-startup.log 2>&1
          docker compose --env-file .env.production -f docker-compose.prod.yml run --rm minio-init >> phase7-startup.log 2>&1
          minio_status=$?
          echo "minio_init_status=$minio_status" >> phase7-startup.log
          if [ "$minio_status" = 0 ]; then
            docker compose --env-file .env.production -f docker-compose.prod.yml build api-migrate api-tools >> phase7-startup.log 2>&1
            echo "tools_build_status=$?" >> phase7-startup.log
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm api-migrate >> phase7-startup.log 2>&1
            echo "migrate_status=$?" >> phase7-startup.log
            docker compose --env-file .env.production -f docker-compose.prod.yml --profile tools run --rm api-tools seed >> phase7-startup.log 2>&1
            echo "seed_status=$?" >> phase7-startup.log
            docker compose --env-file .env.production -f docker-compose.prod.yml --profile tools run --rm api-tools seed:uat >> phase7-startup.log 2>&1
            echo "uat_seed_status=$?" >> phase7-startup.log
          fi
          cat phase7-startup.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-startup-diagnostics
          path: phase7-startup.log
          retention-days: 3
      - name: Stop diagnostic stack
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml --profile tools down --volumes --remove-orphans || true
