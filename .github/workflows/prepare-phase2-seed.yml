name: Prepare Phase 2 seed

on:
  push:
    branches:
      - agent/phase-2-idempotent-seed

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: r4c
          POSTGRES_PASSWORD: r4c_dev
          POSTGRES_DB: r4c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r4c -d r4c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://r4c:r4c_dev@localhost:5432/r4c
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: phase2-seed-ci-only-value-with-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update frozen lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "build(seed): lock TypeScript seed runner"
          git push

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @r4c/api prisma:generate

      - name: Deploy migrations
        run: pnpm --filter @r4c/api prisma:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Verify bootstrap seed
        run: pnpm --filter @r4c/api test:seed
