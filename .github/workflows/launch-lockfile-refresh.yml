name: Launch lockfile refresh

on:
  push:
    branches:
      - fix/launch-security-nanoid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: fix/launch-security-nanoid

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "fix(security): refresh lockfile for safe nanoid"
            git push origin HEAD:fix/launch-security-nanoid
          fi

      - name: Generate Prisma client
        run: pnpm --filter @r4c/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
