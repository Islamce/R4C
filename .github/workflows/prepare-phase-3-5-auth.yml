name: Prepare Phase 3.5 auth contract

on:
  push:
    branches:
      - agent/phase-3-5-auth-contract

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-5-auth-contract

      - name: Add auth session environment defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.env.example')
          text = path.read_text()
          if 'REFRESH_TOKEN_TTL_DAYS=' not in text:
              text = text.replace(
                  'JWT_REFRESH_SECRET=replace-with-another-32-random-characters\n',
                  'JWT_REFRESH_SECRET=replace-with-another-32-random-characters\nREFRESH_TOKEN_TTL_DAYS=14\n',
              )
          if 'RATE_LIMIT_AUTH_SESSION_PER_MINUTE=' not in text:
              text = text.replace(
                  'RATE_LIMIT_LOGIN_PER_MINUTE=5\n',
                  'RATE_LIMIT_LOGIN_PER_MINUTE=5\nRATE_LIMIT_AUTH_SESSION_PER_MINUTE=20\n',
              )
          path.write_text(text)
          PY

      - name: Add auth session verification to CI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          marker = '''      - name: Verify rate limiting and proxy client isolation
                run: |
                  pnpm --filter @r4c/api test:rate-limit > rate-limit-verification.txt 2>&1
                  cat rate-limit-verification.txt
          '''.replace('              ', '')
          addition = marker + '''
          - name: Verify refresh rotation and logout
            run: |
              pnpm --filter @r4c/api test:auth-session > auth-session-verification.txt 2>&1
              cat auth-session-verification.txt

          - name: Retain auth session verification evidence
            uses: actions/upload-artifact@v4
            with:
              name: auth-session-verification-evidence
              path: auth-session-verification.txt
              retention-days: 30
          '''.replace('          ', '')
          if 'Verify refresh rotation and logout' not in text:
              if marker not in text:
                  raise SystemExit('CI insertion marker not found')
              path.write_text(text.replace(marker, addition))
          PY

      - name: Commit preparation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .github/workflows/ci.yml
          git diff --cached --quiet || git commit -m "ci(auth): verify refresh session contract"
          git push
