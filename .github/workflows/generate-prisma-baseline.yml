name: Generate Prisma baseline

on:
  push:
    branches:
      - agent/production-readiness-migrations

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: r4c
          POSTGRES_PASSWORD: r4c_dev
          POSTGRES_DB: r4c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r4c -d r4c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://r4c:r4c_dev@localhost:5432/r4c
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate baseline migration with Prisma
        run: |
          pnpm --filter @r4c/api exec prisma migrate dev --name 0_init --create-only --skip-generate
          generated_dir="$(find apps/api/prisma/migrations -mindepth 1 -maxdepth 1 -type d -name '*_0_init' -print -quit)"
          test -n "$generated_dir"
          mv "$generated_dir" apps/api/prisma/migrations/0_init
          test -s apps/api/prisma/migrations/0_init/migration.sql

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/migrations
          git commit -m "chore: add Prisma 0_init baseline"
          git push
