name: Finalize Phase 6 fixture expectation

on:
  push:
    branches:
      - agent/phase-6-progress-reporting

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6-progress-reporting
      - name: Match the seeded administrator identity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/test/progress-workspace-e2e.mjs')
          source = path.read_text().replace(
              'approvedHistory.body[0].reviewedBy.displayName, "Phase 6 Administrator"',
              'approvedHistory.body[0].reviewedBy.displayName, "R4C Administrator"',
          )
          path.write_text(source)
          Path('.github/workflows/phase6-finalize-fixture.yml').unlink()
          PY
      - name: Commit fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "test(web): match Phase 6 seeded reviewer"
          git push
