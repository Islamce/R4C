name: Apply Phase 6.5 scoped patch

on:
  push:
    branches:
      - agent/phase-6-5-ux-loop-closers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-6-5-ux-loop-closers
      - name: Apply focused source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('apps/web/components/CostControlDashboard.tsx')
          source = dashboard.read_text()
          source = source.replace(
              'import Link from "next/link";\n',
              'import Link from "next/link";\nimport { useRouter, useSearchParams } from "next/navigation";\n',
              1,
          )
          anchor = 'export function CostControlDashboard() {\n  const { t, locale } = useI18n();\n'
          replacement = 'export function CostControlDashboard() {\n  const { t, locale } = useI18n();\n  const router = useRouter();\n  const searchParams = useSearchParams();\n  const queryProjectId = searchParams.get("projectId") ?? "";\n'
          if anchor not in source:
              raise SystemExit('Dashboard component anchor not found')
          source = source.replace(anchor, replacement, 1)
          old_selection = '''      setProjects(result);
      setProjectId((current) =>
        current && result.some((project) => project.id === current)
          ? current
          : result[0]?.id ?? "",
      );
'''
          new_selection = '''      setProjects(result);
      setProjectId((current) => {
        if (current && result.some((project) => project.id === current)) return current;
        if (queryProjectId) {
          return result.some((project) => project.id === queryProjectId)
            ? queryProjectId
            : "";
        }
        return result[0]?.id ?? "";
      });
'''
          if old_selection not in source:
              raise SystemExit('Dashboard project selection block not found')
          source = source.replace(old_selection, new_selection, 1)
          source = source.replace('  }, []);\n\n  const loadControl', '  }, [queryProjectId]);\n\n  const loadControl', 1)
          sort_anchor = '  function toggleSort(key: SortKey) {\n'
          select_function = '''  function selectProject(nextProjectId: string) {
    setProjectId(nextProjectId);
    const params = new URLSearchParams(searchParams.toString());
    if (nextProjectId) params.set("projectId", nextProjectId);
    else params.delete("projectId");
    const query = params.toString();
    router.replace(query ? `/cost-control?${query}` : "/cost-control", { scroll: false });
  }

'''
          if sort_anchor not in source:
              raise SystemExit('Dashboard sort anchor not found')
          source = source.replace(sort_anchor, select_function + sort_anchor, 1)
          source = source.replace(
              '<select value={projectId} onChange={(event) => setProjectId(event.target.value)}>',
              '<select value={projectId} onChange={(event) => selectProject(event.target.value)}>',
              1,
          )
          dashboard.write_text(source)

          seed = Path('apps/api/prisma/seed.ts')
          source = seed.read_text()
          source = source.replace(
              '  const adminPassword = process.env.SEED_ADMIN_PASSWORD;\n',
              '  const adminPassword = process.env.SEED_ADMIN_PASSWORD;\n  const adminDisplayName = (process.env.SEED_ADMIN_DISPLAY_NAME ?? "R4C Administrator").trim();\n',
              1,
          )
          source = source.replace(
              '  if (!tenantCode || !tenantName || !adminEmail) {\n',
              '  if (!tenantCode || !tenantName || !adminEmail || !adminDisplayName) {\n',
              1,
          )
          source = source.replace('displayName: "R4C Administrator"', 'displayName: adminDisplayName')
          source = source.replace('existingUser.displayName !== "R4C Administrator"', 'existingUser.displayName !== adminDisplayName')
          bottom = '''main()
  .catch((error: unknown) => {
    const message = error instanceof Error ? error.message : String(error);
    console.error(`R4C bootstrap seed failed: ${message}`);
    process.exitCode = 1;
  })
  .finally(async () => {
    await prisma.$disconnect();
  });
'''
          replacement_bottom = '''export async function executeSeed() {
  try {
    await main();
  } catch (error: unknown) {
    const message = error instanceof Error ? error.message : String(error);
    console.error(`R4C bootstrap seed failed: ${message}`);
    process.exitCode = 1;
    throw error;
  } finally {
    await prisma.$disconnect();
  }
}

if (require.main === module) {
  void executeSeed();
}
'''
          if bottom not in source:
              raise SystemExit('Seed execution block not found')
          source = source.replace(bottom, replacement_bottom, 1)
          seed.write_text(source)

          progress = Path('apps/web/components/ProgressWorkspace.tsx')
          source = progress.read_text()
          source = source.replace('  SessionUser,\n', '  BrowserSessionUser,\n', 1)
          source = source.replace('useState<SessionUser | null>', 'useState<BrowserSessionUser | null>', 1)
          source = source.replace('clientApi<{ user: SessionUser }>', 'clientApi<{ user: BrowserSessionUser }>', 1)
          progress.write_text(source)

          foundation = Path('apps/web/app/foundation.css')
          css = foundation.read_text()
          addition = '.login-tenant-context{margin-top:1.5rem;display:grid;gap:.3rem;border-inline-start:4px solid var(--permit-green);padding:.9rem 1rem;background:rgb(47 125 98 / 7%)}.login-tenant-context span{color:var(--steel);font-size:.78rem;font-weight:750}.login-tenant-context strong{color:var(--blueprint-navy);font-size:1.1rem}.login-tenant-context code{color:var(--permit-green);font-weight:850}.tenant-chip small{display:block;color:var(--steel);font-family:"Noto Kufi Arabic","Cascadia Mono",Consolas,monospace;font-size:.65rem}\n'
          if '.login-tenant-context{' not in css:
              foundation.write_text(css + addition)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/CostControlDashboard.tsx apps/api/prisma/seed.ts apps/web/components/ProgressWorkspace.tsx apps/web/app/foundation.css
          git diff --cached --quiet || git commit -m "feat: close Phase 6.5 UX loops"
          git push
