name: BIM quality autofix

on:
  push:
    branches:
      - feat/local-development-runtime
    paths:
      - .github/workflows/bim-quality-autofix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-development-runtime
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/bim-worker/pyproject.toml

      - name: Install BIM worker quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./apps/bim-worker[dev]"

      - name: Apply Ruff fixes and formatting
        run: |
          ruff check apps/bim-worker --fix
          ruff format apps/bim-worker

      - name: Commit deterministic BIM formatting
        run: |
          if git diff --quiet -- apps/bim-worker; then
            echo "BIM worker already matches Ruff rules."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bim-worker
          git commit -m "fix(bim): apply Ruff quality fixes"
          git push origin HEAD:feat/local-development-runtime

      - name: Verify BIM worker
        run: |
          ruff check apps/bim-worker
          pytest -q apps/bim-worker/tests
