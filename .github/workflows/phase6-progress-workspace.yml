name: Phase 6 progress workspace verification

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - ".github/workflows/phase6-progress-workspace.yml"
  push:
    branches:
      - main
      - agent/phase-6-progress-reporting

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: progress-workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: r4c
          POSTGRES_PASSWORD: r4c_dev
          POSTGRES_DB: r4c_phase6
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r4c -d r4c_phase6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://r4c:r4c_dev@127.0.0.1:5432/r4c_phase6
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: r4c-phase6
      S3_ACCESS_KEY: phase6-${{ github.run_id }}
      S3_SECRET_KEY: phase6-value-${{ github.run_id }}
      JWT_ACCESS_SECRET: phase6-${{ github.run_id }}-value-at-least-32-characters-long
      BIM_WORKER_URL: http://127.0.0.1:65535
      BIM_WORKER_TOKEN: phase6-bim-worker-${{ github.run_id }}
      API_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      CORS_ORIGINS: http://127.0.0.1:3000
      TENANT_DEFAULT_CODE: PH6
      RATE_LIMIT_GLOBAL_PER_MINUTE: 2000
      RATE_LIMIT_LOGIN_PER_MINUTE: 100
      RATE_LIMIT_AUTH_SESSION_PER_MINUTE: 100
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated object storage
        run: |
          docker run --rm -d --name r4c-phase6-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs r4c-phase6-minio
          exit 1

      - name: Generate Prisma client and migrate
        run: |
          pnpm --filter @r4c/api prisma:generate
          pnpm --filter @r4c/api prisma:migrate:deploy
          pnpm --filter @r4c/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Typecheck and build monorepo
        run: |
          pnpm typecheck
          pnpm build

      - name: Seed Phase 6 users and separation-of-duties roles
        env:
          SEED_TENANT_CODE: PH6
          SEED_TENANT_NAME: Phase 6 Progress Control Tenant
          SEED_ADMIN_EMAIL: phase6.admin@r4c.test
          SEED_ADMIN_PASSWORD: Phase6-${{ github.run_id }}-Admin-Correct-Horse-Battery-Staple
          JOURNEY_SUBMIT_EMAIL: phase6.submit@r4c.test
          JOURNEY_SUBMIT_PASSWORD: Phase6-${{ github.run_id }}-Submit-Correct-Horse-Battery-Staple
        run: |
          pnpm --filter @r4c/api seed
          pnpm --filter @r4c/api exec node - <<'NODE' >> "$GITHUB_ENV"
          const argon2 = require('argon2');
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();

          async function main() {
            const tenant = await prisma.tenant.findUnique({ where: { code: 'PH6' } });
            if (!tenant) throw new Error('Phase 6 tenant not found');
            const permissionCodes = ['project:read', 'progress:read', 'progress:submit'];
            const permissions = await prisma.permission.findMany({
              where: { code: { in: permissionCodes } },
            });
            if (permissions.length !== permissionCodes.length) {
              throw new Error(`Missing submit-only permissions: ${permissionCodes.join(', ')}`);
            }
            const role = await prisma.role.create({
              data: {
                tenantId: tenant.id,
                code: 'PROGRESS_SUBMITTER',
                name: 'Progress submitter',
                permissions: {
                  create: permissions.map((permission) => ({ permissionId: permission.id })),
                },
              },
            });
            const passwordHash = await argon2.hash(process.env.JOURNEY_SUBMIT_PASSWORD, {
              type: argon2.argon2id,
            });
            const user = await prisma.user.create({
              data: {
                email: process.env.JOURNEY_SUBMIT_EMAIL,
                displayName: 'Phase 6 Submitter',
                passwordHash,
              },
            });
            await prisma.tenantMembership.create({
              data: { tenantId: tenant.id, userId: user.id, roleId: role.id },
            });
            console.log(`JOURNEY_TENANT_ID=${tenant.id}`);
          }

          main().finally(() => prisma.$disconnect());
          NODE

      - name: Start production API and web servers
        run: |
          node apps/api/dist/main.js > phase6-api-runtime.log 2>&1 &
          echo $! > phase6-api-runtime.pid
          pnpm --filter @r4c/web exec next start -p 3000 > phase6-web-runtime.log 2>&1 &
          echo $! > phase6-web-runtime.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat phase6-api-runtime.log
          cat phase6-web-runtime.log
          exit 1

      - name: Verify submit, review, history, duties, and earned-value loop
        id: progress_test
        env:
          JOURNEY_ADMIN_EMAIL: phase6.admin@r4c.test
          JOURNEY_ADMIN_PASSWORD: Phase6-${{ github.run_id }}-Admin-Correct-Horse-Battery-Staple
          JOURNEY_SUBMIT_EMAIL: phase6.submit@r4c.test
          JOURNEY_SUBMIT_PASSWORD: Phase6-${{ github.run_id }}-Submit-Correct-Horse-Battery-Staple
          JOURNEY_WEB_URL: http://127.0.0.1:3000
          JOURNEY_API_URL: http://127.0.0.1:4000/api/v1
        run: |
          set +e
          pnpm --filter @r4c/web test:progress-workspace > progress-workspace-verification.txt 2>&1
          status=$?
          cat progress-workspace-verification.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain progress-workspace evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progress-workspace-verification-evidence
          path: |
            progress-workspace-verification.txt
            phase6-api-runtime.log
            phase6-web-runtime.log
          retention-days: 30

      - name: Publish verification evidence to pull request
        if: always() && github.event_name == 'push' && github.ref_name == 'agent/phase-6-progress-reporting'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.progress_test.outputs.status }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          test -n "$pr_number" || exit 0
          {
            echo "## Phase 6 automated verification"
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Head: \`$GITHUB_SHA\`"
            echo "Progress journey exit status: \`${TEST_STATUS:-not-run}\`"
            echo
            echo '```text'
            test -f progress-workspace-verification.txt && cat progress-workspace-verification.txt || echo "Progress journey did not produce output."
            echo '```'
          } > phase6-pr-evidence.md
          gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body-file phase6-pr-evidence.md

      - name: Stop verification servers
        if: always()
        run: |
          test -f phase6-web-runtime.pid && kill $(cat phase6-web-runtime.pid) || true
          test -f phase6-api-runtime.pid && kill $(cat phase6-api-runtime.pid) || true
          docker rm -f r4c-phase6-minio || true

      - name: Enforce progress journey result
        if: always()
        env:
          TEST_STATUS: ${{ steps.progress_test.outputs.status }}
        run: test "${TEST_STATUS:-1}" = "0"
