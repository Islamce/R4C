name: Prepare Phase 3 rate limiting

on:
  pull_request:
  push:
    branches:
      - agent/phase-3-rate-limiting

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-rate-limiting

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update frozen lockfile
        run: pnpm install --lockfile-only

      - name: Add documented rate-limit configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.env.example')
          text = path.read_text()
          additions = '\n'.join([
              'RATE_LIMIT_GLOBAL_PER_MINUTE=100',
              'RATE_LIMIT_LOGIN_PER_MINUTE=5',
              'RATE_LIMIT_UPLOAD_PER_MINUTE=10',
              'RATE_LIMIT_SEARCH_EXPORT_PER_MINUTE=30',
              'TRUST_PROXY_HOPS=1',
              '',
          ])
          if 'RATE_LIMIT_GLOBAL_PER_MINUTE=' not in text:
              path.write_text(text.rstrip() + '\n' + additions)
          PY

      - name: Add persistent rate-limit verification to CI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          marker = '      - name: Run authenticated runtime integration\n        run: pnpm --filter @r4c/api test:e2e\n'
          addition = marker + '\n'.join([
              '      - name: Verify rate limiting and proxy client isolation',
              '        run: pnpm --filter @r4c/api test:rate-limit 2>&1 | tee rate-limit-verification.txt',
              '',
              '      - name: Retain rate-limit verification evidence',
              '        uses: actions/upload-artifact@v4',
              '        with:',
              '          name: rate-limit-verification-evidence',
              '          path: rate-limit-verification.txt',
              '          retention-days: 30',
              '',
          ])
          if 'Verify rate limiting and proxy client isolation' not in text:
              if marker not in text:
                  raise SystemExit('CI insertion marker not found')
              path.write_text(text.replace(marker, addition))
          PY

      - name: Commit generated preparation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .env.example .github/workflows/ci.yml
          git diff --cached --quiet || git commit -m "build(security): lock throttler and wire verification"
          git push
