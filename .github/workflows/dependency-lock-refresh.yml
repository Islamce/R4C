name: Dependency lock refresh

on:
  push:
    branches:
      - feat/local-development-runtime
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-development-runtime
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate frozen dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Verify production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Verify application quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches patched manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(security): refresh patched dependency lockfile"
          git push origin HEAD:feat/local-development-runtime
