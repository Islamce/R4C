name: Capture Phase 5 typecheck diagnostics

on:
  push:
    branches:
      - agent/phase-5-5d-cost-dashboard

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-5-5d-cost-dashboard
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture exact diagnostics
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck > docs/phase5-typecheck-diagnostics.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phase5-typecheck-diagnostics.txt
          git diff --cached --quiet || git commit -m "chore(web): capture Phase 5 typecheck diagnostics"
          git push
