name: Migrate BIM viewer session transport

on:
  pull_request:
  push:
    branches:
      - agent/phase-4-frontend-foundation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-4-frontend-foundation
      - name: Route viewer through the server session boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          viewer = Path('apps/web/components/BimViewer.tsx')
          text = viewer.read_text()
          replacements = {
              'const API_URL = process.env.NEXT_PUBLIC_API_URL ?? "http://localhost:4000/api/v1";': 'const API_URL = "/api/backend";',
              '  const token = () => window.localStorage.getItem("r4c_access_token");\n\n': '',
              '    const accessToken = token();\n': '',
              '    if (!accessToken) throw new Error("Sign in first; no R4C access token was found.");\n': '',
              '        authorization: `Bearer ${accessToken}`,\n': '',
              '      ...options,\n      headers: {': '      ...options,\n      credentials: "same-origin",\n      headers: {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected viewer fragment not found: {old[:60]}')
              text = text.replace(old, new, 1)
          if 'localStorage' in text or 'r4c_access_token' in text:
              raise SystemExit('Browser token storage remains in BIM viewer')
          viewer.write_text(text)

          test = Path('apps/web/test/frontend-journey-e2e.mjs')
          evidence = test.read_text()
          evidence = evidence.replace(
              '[".next", "node_modules", "test", "BimViewer.tsx"]',
              '[".next", "node_modules", "test"]',
          )
          evidence = evidence.replace(
              'phase4BrowserStorage=0 legacyViewerExcluded=true',
              'phase4BrowserStorage=0 viewerServerSession=true',
          )
          test.write_text(evidence)
          Path('.github/workflows/phase4-migrate-viewer-session.yml').unlink()
          PY
      - name: Commit focused viewer session migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix(web): move BIM viewer off browser token storage"
          git push
